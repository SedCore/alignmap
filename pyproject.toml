[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alignmap"
version = "0.2.0"
description = "Mapping the AI-alignment literature across venues: reproducible clustering, source-adjusted tests of how subfields shift, and a method comparison scored against community topic tags."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pierre Sedi Nzakuna" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
umap = ["umap-learn>=0.5"]
sbert = ["sentence-transformers>=2.7"]
llm = ["anthropic>=0.40"]
# everything the "modern-*" presets need
modern = ["umap-learn>=0.5", "sentence-transformers>=2.7"]
dev = ["pytest>=7", "umap-learn>=0.5"]

[project.scripts]
alignmap = "alignmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/sedcore/alignmap"
